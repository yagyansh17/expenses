<!DOCTYPE html>
<html lang="en">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',sans-serif;background:#0f0f1a;min-height:100vh;max-width:480px;margin:0 auto;color:#fff;}
button{cursor:pointer;font-family:inherit;}
input,select{font-family:inherit;}
::-webkit-scrollbar{display:none;}

/* SETUP */
.setup-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#0f0f1a,#1a1a2e,#16213e);}
.setup-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:36px 24px;width:100%;max-width:400px;text-align:center;backdrop-filter:blur(20px);}
.setup-logo{font-size:56px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px;animation:float 3s ease-in-out infinite;line-height:1;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.setup-title{font-size:22px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;}
.setup-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:28px;line-height:1.6;}
.signin-btn{width:100%;padding:14px;border-radius:16px;border:none;background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;font-weight:700;font-size:15px;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(167,139,250,.3);}
.lock-icon{font-size:11px;color:rgba(167,139,250,.6);margin-top:12px;}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(30,30,50,.95);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);}
.toast.show{opacity:1;}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(15,15,26,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:998;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid rgba(167,139,250,.2);border-top-color:#a78bfa;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-txt{font-size:13px;color:rgba(255,255,255,.5);}

/* HEADER */
.header{background:linear-gradient(145deg,#1a1a2e,#16213e);padding:22px 20px 70px;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(167,139,250,.15),transparent 70%);border-radius:50%;}
.header::after{content:'';position:absolute;bottom:-40px;left:-40px;width:150px;height:150px;background:radial-gradient(circle,rgba(236,72,153,.1),transparent 70%);border-radius:50%;}
.header-total{font-size:34px;font-weight:800;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:4px;line-height:1;}
.month-scroll{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:4px;}
.month-btn{padding:5px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.1);font-size:12px;white-space:nowrap;background:transparent;color:rgba(255,255,255,.5);}
.month-btn.active{background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;font-weight:700;border-color:transparent;}
.user-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border-radius:20px;padding:3px 10px;font-size:11px;color:rgba(255,255,255,.5);margin-top:6px;}

/* CARDS */
.cards{padding:0 14px;margin-top:-42px;display:grid;gap:8px;position:relative;z-index:2;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-2{grid-template-columns:1fr 1fr;}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:13px 14px;backdrop-filter:blur(10px);}
.card-icon{font-size:20px;}
.card-val{font-size:15px;font-weight:700;margin-top:4px;}
.card-lbl{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;}

/* NAV */
.nav{display:flex;gap:5px;padding:12px 14px 0;overflow-x:auto;}
.nav-btn{flex-shrink:0;padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:600;background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);white-space:nowrap;}
.nav-btn.active{background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(167,139,250,.3);}
.content{padding:14px 14px 80px;}

/* TYPE SELECTOR */
.type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px;}
.type-btn{padding:10px 6px;border-radius:12px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);font-size:11px;font-weight:700;color:rgba(255,255,255,.5);text-align:center;transition:all .2s;}

/* FORM */
.form-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px;}
.form-title{font-weight:800;font-size:17px;color:#fff;margin-bottom:16px;}
.lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.45);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;}
.inp{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.1);font-size:14px;margin-bottom:14px;background:rgba(255,255,255,.06);color:#fff;outline:none;}
.inp:focus{border-color:#a78bfa;}
.inp::placeholder{color:rgba(255,255,255,.25);}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px;}
.cat-btn{padding:9px 10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);font-size:12px;font-weight:600;color:rgba(255,255,255,.5);text-align:left;}
.payer-grid{display:flex;gap:8px;margin-bottom:14px;}
.payer-btn{flex:1;padding:11px;border-radius:14px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);font-size:13px;font-weight:700;color:rgba(255,255,255,.5);text-align:center;}
.btn-row{display:flex;gap:10px;margin-top:8px;}
.btn-cancel{flex:1;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);font-weight:600;color:rgba(255,255,255,.6);font-size:14px;}
.btn-save{flex:2;padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;font-weight:800;font-size:15px;box-shadow:0 6px 20px rgba(167,139,250,.3);}

/* CHIPS */
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;}
.chip{padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);font-size:11px;white-space:nowrap;}

/* SECTION CARD */
.section-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px;margin-bottom:14px;}
.section-title{font-weight:700;font-size:14px;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.bar-row{margin-bottom:12px;}
.bar-meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:rgba(255,255,255,.8);}
.bar-track{height:6px;border-radius:4px;background:rgba(255,255,255,.08);}
.bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.empty{text-align:center;color:rgba(255,255,255,.3);font-size:14px;padding:28px 0;line-height:1.8;}

/* EXP ROW */
.exp-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.exp-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.exp-payer{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;display:inline-block;margin-top:3px;}
.exp-type-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;display:inline-block;margin-top:3px;margin-left:4px;}
.action-btn{font-size:11px;padding:3px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);}
.del-btn{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08);color:#ef4444;}

/* PERSONAL TOGGLE */
.person-toggle{display:flex;gap:0;background:rgba(255,255,255,.06);border-radius:14px;padding:4px;margin-bottom:14px;}
.person-btn{flex:1;padding:9px;border-radius:10px;border:none;font-size:13px;font-weight:700;background:transparent;color:rgba(255,255,255,.4);}
.person-btn.active{color:#fff;}

/* INVESTMENT CARD */
.inv-card{border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid rgba(52,211,153,.2);background:rgba(52,211,153,.05);}
.inv-name{font-weight:700;font-size:14px;color:#fff;}
.inv-meta{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;}
.inv-amt{font-weight:800;font-size:16px;color:#34d399;}

/* INSIGHTS */
.insight-card{border-radius:16px;padding:14px 16px;margin-bottom:10px;border:1px solid;display:flex;align-items:flex-start;gap:12px;}
.insight-card.warn{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.2);}
.insight-card.danger{background:rgba(239,68,68,.06);border-color:rgba(239,68,68,.2);}
.insight-card.good{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.2);}
.insight-card.info{background:rgba(167,139,250,.06);border-color:rgba(167,139,250,.2);}
.insight-icon{font-size:24px;flex-shrink:0;}
.insight-title{font-size:13px;font-weight:700;margin-bottom:3px;}
.insight-desc{font-size:12px;color:rgba(255,255,255,.55);line-height:1.5;}
.insight-card.warn .insight-title{color:#fbbf24;}
.insight-card.danger .insight-title{color:#ef4444;}
.insight-card.good .insight-title{color:#22c55e;}
.insight-card.info .insight-title{color:#a78bfa;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px;}
.payer-split{display:flex;gap:10px;margin-bottom:14px;}
.payer-split-card{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;text-align:center;}

/* FAB */
.fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;font-size:28px;box-shadow:0 6px 20px rgba(167,139,250,.4);z-index:97;}
.sync-btn{position:fixed;bottom:26px;left:24px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);font-size:18px;z-index:97;}
.signout-btn{padding:4px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);font-size:11px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
function enc(s){return btoa(unescape(encodeURIComponent(s)));}
function dec(s){try{return decodeURIComponent(escape(atob(s)));}catch{return s;}}
const _D={c:enc("228354843386-cc1tdkhsgn33386knd855em1sjjgg86t.apps.googleusercontent.com"),s:enc("121wpQx5SM-ClNVww_S9wyMMDsfExGWwO5FiQYxNxJAk")};

// ── CONSTANTS ──────────────────────────────────────────
const PAYERS=["Yagyansh","Tanu"];
const PC={Yagyansh:"#a78bfa",Tanu:"#ec4899"};
const EXP_TYPES=["Shared","Personal","Investment"];
const TYPE_COLORS={Shared:"#60a5fa",Personal:"#fbbf24",Investment:"#34d399"};
const TYPE_ICONS={Shared:"🤝",Personal:"👤",Investment:"📈"};

const SHARED_CATS=[
  {id:"grocery",label:"Grocery",icon:"🛒",color:"#34d399"},
  {id:"fruits",label:"Fruits & Veggies",icon:"🍎",color:"#fb923c"},
  {id:"dineout",label:"Dine Out",icon:"🍽️",color:"#ec4899"},
  {id:"rent",label:"Rent",icon:"🏠",color:"#a78bfa"},
  {id:"utility",label:"Utility Bills",icon:"⚡",color:"#60a5fa"},
  {id:"supplements",label:"Supplements",icon:"💪",color:"#2dd4bf"},
  {id:"transport",label:"Transport",icon:"🚗",color:"#f97316"},
  {id:"medical",label:"Medical",icon:"💊",color:"#f87171"},
  {id:"home",label:"Home & Maintenance",icon:"🧹",color:"#94a3b8"},
  {id:"gifts",label:"Gifts & Occasions",icon:"🎁",color:"#f472b6"},
  {id:"other",label:"Other",icon:"📦",color:"#a8a29e"},
];
const PERSONAL_CATS=[
  {id:"clothing",label:"Clothing & Shopping",icon:"👗",color:"#f472b6"},
  {id:"grooming",label:"Personal Care",icon:"🧴",color:"#c084fc"},
  {id:"gym",label:"Gym / Fitness",icon:"🏋️",color:"#34d399"},
  {id:"subscriptions",label:"Subscriptions",icon:"💻",color:"#60a5fa"},
  {id:"entertainment",label:"Entertainment",icon:"🎬",color:"#94a3b8"},
  {id:"education",label:"Education",icon:"📚",color:"#fbbf24"},
  {id:"personal_other",label:"Other",icon:"📦",color:"#a8a29e"},
];
const INVEST_CATS=[
  {id:"sip",label:"SIP / Mutual Fund",icon:"📊",color:"#34d399"},
  {id:"stocks",label:"Stocks",icon:"📈",color:"#60a5fa"},
  {id:"fd",label:"FD / RD",icon:"🏦",color:"#fbbf24"},
  {id:"ppf",label:"PPF / NPS",icon:"🛡️",color:"#a78bfa"},
  {id:"crypto",label:"Crypto",icon:"₿",color:"#f97316"},
  {id:"invest_other",label:"Other Investment",icon:"💰",color:"#94a3b8"},
];
const ALL_CATS=[...SHARED_CATS,...PERSONAL_CATS,...INVEST_CATS];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SHEET_NAME="Expenses";
const HEADER=["ID","Date","Description","Amount","Category","Payer","Note","Type","InvestmentName"];

let CFG={clientId:dec(_D.c),sheetId:dec(_D.s)};
const saved=JSON.parse(localStorage.getItem("yt_cfg3")||"{}");
if(saved.clientId)CFG.clientId=saved.clientId;
if(saved.sheetId)CFG.sheetId=saved.sheetId;

let accessToken=null,tokenExpiry=0,tokenClient=null;
let state={
  expenses:[],view:"dashboard",
  filterMonth:new Date().getMonth(),filterYear:new Date().getFullYear(),
  editId:null,histSearch:"",histCat:"all",histPayer:"all",histType:"all",
  userEmail:"",personalPerson:"Yagyansh",
};
let _selCat="grocery",_selPayer="Yagyansh",_selType="Shared";

// ── UTILS ──────────────────────────────────────────────
const today=()=>new Date().toISOString().split("T")[0];
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const fmt=n=>"₹"+Number(n).toLocaleString("en-IN");
const catOf=id=>ALL_CATS.find(c=>c.id===id)||ALL_CATS[ALL_CATS.length-1];
const catsFor=type=>type==="Investment"?INVEST_CATS:type==="Personal"?PERSONAL_CATS:SHARED_CATS;

function showToast(msg,dur=3000){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),dur);}
function setLoading(on,msg="Loading..."){let el=document.getElementById("lo");if(on){if(!el){el=document.createElement("div");el.id="lo";el.className="loading-overlay";document.body.appendChild(el);}el.innerHTML=`<div class="spinner"></div><div class="loading-txt">${msg}</div>`;}else{if(el)el.remove();}}

// ── OAUTH ──────────────────────────────────────────────
function initTokenClient(){
  return new Promise(res=>{
    const iv=setInterval(()=>{
      if(window.google){clearInterval(iv);
        const c=google.accounts.oauth2.initTokenClient({
          client_id:CFG.clientId,scope:"https://www.googleapis.com/auth/spreadsheets",
          callback:(r)=>{
            if(r.error){showToast("❌ Auth failed: "+r.error);return;}
            accessToken=r.access_token;tokenExpiry=Date.now()+((r.expires_in-60)*1000);
            fetch(`https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=${accessToken}`)
              .then(x=>x.json()).then(x=>{state.userEmail=x.email||"";loadExpenses();});
          }
        });res(c);}
    },200);
  });
}
async function signIn(){if(!tokenClient)tokenClient=await initTokenClient();tokenClient.requestAccessToken();}
async function ensureToken(){
  if(accessToken&&Date.now()<tokenExpiry)return true;
  if(!tokenClient)tokenClient=await initTokenClient();
  return new Promise(res=>{
    tokenClient.callback=(r)=>{if(r.error){showToast("❌ Session expired.");res(false);return;}accessToken=r.access_token;tokenExpiry=Date.now()+((r.expires_in-60)*1000);res(true);};
    tokenClient.requestAccessToken({prompt:""});
  });
}
function signOut(){accessToken=null;tokenClient=null;state.view="setup";state.expenses=[];state.userEmail="";render();}

// ── SHEETS ─────────────────────────────────────────────
const BASE="https://sheets.googleapis.com/v4/spreadsheets";
const hdrs=()=>({Authorization:"Bearer "+accessToken,"Content-Type":"application/json"});
async function apiGet(r){const x=await fetch(`${BASE}/${CFG.sheetId}/values/${encodeURIComponent(r)}`,{headers:hdrs()});if(!x.ok)throw new Error(await x.text());return x.json();}
async function apiAppend(v){const x=await fetch(`${BASE}/${CFG.sheetId}/values/${encodeURIComponent(SHEET_NAME)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{method:"POST",headers:hdrs(),body:JSON.stringify({values:v})});if(!x.ok)throw new Error(await x.text());return x.json();}
async function apiUpdate(r,v){const x=await fetch(`${BASE}/${CFG.sheetId}/values/${encodeURIComponent(r)}?valueInputOption=RAW`,{method:"PUT",headers:hdrs(),body:JSON.stringify({values:v})});if(!x.ok)throw new Error(await x.text());return x.json();}
async function apiClear(r){const x=await fetch(`${BASE}/${CFG.sheetId}/values/${encodeURIComponent(r)}:clear`,{method:"POST",headers:hdrs()});if(!x.ok)throw new Error(await x.text());return x.json();}

async function loadExpenses(){
  setLoading(true,"Fetching expenses...");state.view="dashboard";
  try{
    const d=await apiGet(`${SHEET_NAME}!A1:I`);const rows=d.values||[];
    if(!rows.length||rows[0][0]!=="ID"){await apiUpdate(`${SHEET_NAME}!A1:I1`,[HEADER]);state.expenses=[];}
    else state.expenses=rows.slice(1).filter(r=>r[0]).map(r=>({
      id:r[0],date:r[1]||today(),desc:r[2]||"",amount:parseFloat(r[3])||0,
      cat:r[4]||"other",payer:r[5]||"Yagyansh",note:r[6]||"",
      type:r[7]||"Shared",invName:r[8]||""
    })).reverse();
  }catch(e){showToast("❌ Load failed: "+e.message);}
  setLoading(false);render();
}
async function addExpense(exp){
  if(!await ensureToken())return;setLoading(true,"Saving...");
  try{await apiAppend([[exp.id,exp.date,exp.desc,exp.amount,exp.cat,exp.payer,exp.note||"",exp.type,exp.invName||""]]);state.expenses=[exp,...state.expenses];state.view="dashboard";showToast("✅ Saved!");}
  catch(e){showToast("❌ "+e.message);}
  setLoading(false);render();
}
async function updateExpense(exp){
  if(!await ensureToken())return;setLoading(true,"Updating...");
  try{const d=await apiGet(`${SHEET_NAME}!A1:I`);const rows=d.values||[];const i=rows.findIndex(r=>r[0]===exp.id);
    if(i>0)await apiUpdate(`${SHEET_NAME}!A${i+1}:I${i+1}`,[[exp.id,exp.date,exp.desc,exp.amount,exp.cat,exp.payer,exp.note||"",exp.type,exp.invName||""]]);
    state.expenses=state.expenses.map(e=>e.id===exp.id?exp:e);state.view="history";state.editId=null;showToast("✅ Updated!");}
  catch(e){showToast("❌ "+e.message);}
  setLoading(false);render();
}
async function deleteExpense(id){
  if(!await ensureToken())return;setLoading(true,"Deleting...");
  try{const d=await apiGet(`${SHEET_NAME}!A1:I`);const rows=(d.values||[]).filter(r=>r[0]!==id);
    await apiClear(`${SHEET_NAME}!A1:I`);await apiUpdate(`${SHEET_NAME}!A1:I${Math.max(rows.length,1)}`,rows.length?rows:[HEADER]);
    state.expenses=state.expenses.filter(e=>e.id!==id);showToast("🗑️ Deleted!");}
  catch(e){showToast("❌ "+e.message);}
  setLoading(false);render();
}

// ── INSIGHTS ───────────────────────────────────────────
function generateInsights(expenses){
  const insights=[];const now=new Date();
  const thisMonth=expenses.filter(e=>{const d=new Date(e.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  const lastMonth=expenses.filter(e=>{const d=new Date(e.date);const lm=new Date(now.getFullYear(),now.getMonth()-1,1);return d.getMonth()===lm.getMonth()&&d.getFullYear()===lm.getFullYear();});
  const shared=thisMonth.filter(e=>e.type==="Shared");
  const sharedTotal=shared.reduce((s,e)=>s+e.amount,0);

  // Dine out
  const dineTotal=shared.filter(e=>e.cat==="dineout").reduce((s,e)=>s+e.amount,0);
  if(dineTotal>0&&sharedTotal>0){const pct=(dineTotal/sharedTotal*100).toFixed(0);
    if(pct>20)insights.push({type:"danger",icon:"🍽️",title:`Dine-out is ${pct}% of shared spending!`,desc:`₹${dineTotal.toLocaleString("en-IN")} spent eating out. Consider cooking at home more to save up.`});
    else if(pct>10)insights.push({type:"warn",icon:"🍽️",title:"Dine-out spending rising",desc:`${fmt(dineTotal)} dining out this month (${pct}% of shared total).`});}

  // Fruits
  const last7=new Date(now-7*24*60*60*1000).toISOString().split("T")[0];
  if(!expenses.filter(e=>e.cat==="fruits"&&e.date>=last7).length)
    insights.push({type:"warn",icon:"🍎",title:"No fruits & veggies this week!",desc:"You haven't logged any fruits in 7 days. A healthy diet starts with the basics!"});

  // Gym check
  const last14=new Date(now-14*24*60*60*1000).toISOString().split("T")[0];
  if(expenses.some(e=>e.cat==="gym")&&!expenses.filter(e=>e.cat==="gym"&&e.date>=last14).length)
    insights.push({type:"warn",icon:"🏋️",title:"No gym expense logged in 2 weeks",desc:"Are you skipping the gym or just forgot to log it? Stay consistent!"});

  // Investment check
  const thisMonthInv=thisMonth.filter(e=>e.type==="Investment");
  if(!thisMonthInv.length)insights.push({type:"warn",icon:"📈",title:"No investments logged this month",desc:"Don't forget to log your SIPs or stock purchases. Consistency in investing matters!"});
  else{const invTotal=thisMonthInv.reduce((s,e)=>s+e.amount,0);insights.push({type:"good",icon:"📈",title:`${fmt(invTotal)} invested this month!`,desc:`Great job! You've made ${thisMonthInv.length} investment entr${thisMonthInv.length>1?"ies":"y"} this month.`});}

  // Personal spending check
  ["Yagyansh","Tanu"].forEach(p=>{
    const pExp=thisMonth.filter(e=>e.type==="Personal"&&e.payer===p);
    const pTotal=pExp.reduce((s,e)=>s+e.amount,0);
    if(pTotal>5000)insights.push({type:"warn",icon:"👤",title:`${p}'s personal spending is high`,desc:`${fmt(pTotal)} in personal expenses this month. Worth reviewing!`});
  });

  // Month over month
  if(lastMonth.length){
    const lastSharedTotal=lastMonth.filter(e=>e.type==="Shared").reduce((s,e)=>s+e.amount,0);
    if(sharedTotal>lastSharedTotal*1.2)insights.push({type:"danger",icon:"📊",title:`Shared spending up ${((sharedTotal/lastSharedTotal-1)*100).toFixed(0)}% vs last month`,desc:`You've spent ${fmt(sharedTotal-lastSharedTotal)} more than last month on shared expenses.`});
    else if(sharedTotal<lastSharedTotal*0.9)insights.push({type:"good",icon:"🎉",title:"Spending down vs last month!",desc:"You're spending less than last month on shared expenses. Keep it up!"});}

  // Supplements
  const last10=new Date(now-10*24*60*60*1000).toISOString().split("T")[0];
  if(expenses.some(e=>e.cat==="supplements")&&!expenses.filter(e=>e.cat==="supplements"&&e.date>=last10).length)
    insights.push({type:"info",icon:"💪",title:"Supplements not logged recently",desc:"Haven't seen supplement expenses in 10 days. Don't skip them!"});

  if(!insights.filter(i=>i.type==="danger"||i.type==="warn").length&&thisMonth.length>3)
    insights.push({type:"good",icon:"✨",title:"Everything looks balanced!",desc:"No major red flags this month. Keep tracking consistently!"});

  return insights.slice(0,6);
}

function renderStats(fe){
  const sharedFe=fe.filter(e=>e.type==="Shared");
  const personalFe=fe.filter(e=>e.type==="Personal");
  const investFe=fe.filter(e=>e.type==="Investment");
  const sharedTotal=sharedFe.reduce((s,e)=>s+e.amount,0);
  const personalTotal=personalFe.reduce((s,e)=>s+e.amount,0);
  const investTotal=investFe.reduce((s,e)=>s+e.amount,0);
  const grandTotal=sharedTotal+personalTotal;
  const days={};sharedFe.forEach(e=>{days[e.date]=(days[e.date]||0)+e.amount;});
  const avg=Object.keys(days).length?(sharedTotal/Object.keys(days).length).toFixed(0):0;
  const yShared=sharedFe.filter(e=>e.payer==="Yagyansh").reduce((s,e)=>s+e.amount,0);
  const tShared=sharedFe.filter(e=>e.payer==="Tanu").reduce((s,e)=>s+e.amount,0);
  const yPersonal=personalFe.filter(e=>e.payer==="Yagyansh").reduce((s,e)=>s+e.amount,0);
  const tPersonal=personalFe.filter(e=>e.payer==="Tanu").reduce((s,e)=>s+e.amount,0);

  const sharedCats=SHARED_CATS.map(c=>({...c,total:sharedFe.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount,0)})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);

  return `<div class="stats-grid">
    <div class="stat-card"><div style="font-size:22px">🤝</div><div style="font-size:17px;font-weight:800;margin-top:5px">${fmt(sharedTotal)}</div><div style="font-size:11px;color:rgba(255,255,255,.4)">Shared Total</div></div>
    <div class="stat-card"><div style="font-size:22px">👤</div><div style="font-size:17px;font-weight:800;margin-top:5px;color:#fbbf24">${fmt(personalTotal)}</div><div style="font-size:11px;color:rgba(255,255,255,.4)">Personal Total</div></div>
    <div class="stat-card"><div style="font-size:22px">📈</div><div style="font-size:17px;font-weight:800;margin-top:5px;color:#34d399">${fmt(investTotal)}</div><div style="font-size:11px;color:rgba(255,255,255,.4)">Invested</div></div>
    <div class="stat-card"><div style="font-size:22px">📆</div><div style="font-size:17px;font-weight:800;margin-top:5px">${fmt(avg)}</div><div style="font-size:11px;color:rgba(255,255,255,.4)">Daily Avg</div></div>
  </div>
  <div class="section-card"><div class="section-title">👥 Shared — Who Paid</div>
    ${[["Yagyansh",yShared,"#a78bfa","👤"],["Tanu",tShared,"#ec4899","👩"]].map(([n,v,c,ic])=>`<div class="bar-row"><div class="bar-meta"><span>${ic} ${n}</span><span style="font-weight:700;color:${c}">${fmt(v)} <span style="color:rgba(255,255,255,.3);font-weight:400">(${sharedTotal?(v/sharedTotal*100).toFixed(0):0}%)</span></span></div><div class="bar-track"><div class="bar-fill" style="width:${sharedTotal?(v/sharedTotal*100).toFixed(1):0}%;background:${c}"></div></div></div>`).join("")}
  </div>
  <div class="section-card"><div class="section-title">👤 Personal Breakdown</div>
    ${[["Yagyansh",yPersonal,"#a78bfa","👤"],["Tanu",tPersonal,"#ec4899","👩"]].map(([n,v,c,ic])=>`<div class="bar-row"><div class="bar-meta"><span>${ic} ${n}</span><span style="font-weight:700;color:${c}">${fmt(v)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${personalTotal?(v/personalTotal*100).toFixed(1):0}%;background:${c}"></div></div></div>`).join("")}
  </div>
  ${sharedCats.length?`<div class="section-card"><div class="section-title">🏷️ Shared Categories</div>${sharedCats.map(c=>`<div class="bar-row"><div class="bar-meta"><span>${c.icon} ${c.label}</span><span style="font-weight:700">${fmt(c.total)} <span style="color:rgba(255,255,255,.3);font-weight:400">(${sharedTotal?(c.total/sharedTotal*100).toFixed(0):0}%)</span></span></div><div class="bar-track"><div class="bar-fill" style="width:${sharedTotal?(c.total/sharedTotal*100).toFixed(1):0}%;background:${c.color}"></div></div></div>`).join("")}</div>`:""}
  ${Object.keys(days).length?`<div class="section-card"><div class="section-title">🔥 Top Spending Days</div>${Object.entries(days).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([d,v])=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px"><span style="color:rgba(255,255,255,.6)">${new Date(d).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}</span><span style="font-weight:700">${fmt(v)}</span></div>`).join("")}</div>`:""}`;
}

function renderAddForm(){
  const e=state.editId?state.expenses.find(x=>x.id===state.editId):null;
  if(e){_selCat=e.cat;_selPayer=e.payer;_selType=e.type||"Shared";}
  const desc=e?.desc||"",amt=e?.amount||"",dt=e?.date||today(),note=e?.note||"",invName=e?.invName||"";
  const cats=catsFor(_selType);
  const defaultCat=cats[0].id;
  if(!cats.find(c=>c.id===_selCat))_selCat=defaultCat;

  return `<div class="form-card">
    <div class="form-title">${e?"✏️ Edit":"➕ New Expense"}</div>
    <div class="lbl">Expense Type</div>
    <div class="type-grid">
      ${EXP_TYPES.map(t=>`<button class="type-btn" id="tb_${t}" style="border-color:${_selType===t?TYPE_COLORS[t]:"rgba(255,255,255,.08)"};background:${_selType===t?TYPE_COLORS[t]+"22":"rgba(255,255,255,.04)"};color:${_selType===t?TYPE_COLORS[t]:"rgba(255,255,255,.4)"}" onclick="selType('${t}')">${TYPE_ICONS[t]}<br/>${t}</button>`).join("")}
    </div>
    <div class="lbl">Description</div>
    <input class="inp" id="f_desc" value="${desc}" placeholder="e.g. BigBasket groceries"/>
    <div class="lbl">Amount (₹)</div>
    <input class="inp" id="f_amt" type="number" value="${amt}" placeholder="0.00"/>
    <div class="lbl">Paid By</div>
    <div class="payer-grid" id="payer-grid">
      ${PAYERS.map(p=>`<button class="payer-btn" id="pb_${p}" style="border-color:${_selPayer===p?PC[p]:"rgba(255,255,255,.08)"};background:${_selPayer===p?PC[p]+"22":"rgba(255,255,255,.04)"};color:${_selPayer===p?PC[p]:"rgba(255,255,255,.5)"}" onclick="selPayer('${p}')">${p}</button>`).join("")}
    </div>
    <div class="lbl">Category</div>
    <div class="cat-grid" id="cat-grid">
      ${cats.map(c=>`<button class="cat-btn" id="cb_${c.id}" style="border-color:${_selCat===c.id?c.color:"rgba(255,255,255,.08)"};background:${_selCat===c.id?c.color+"22":"rgba(255,255,255,.04)"};color:${_selCat===c.id?c.color:"rgba(255,255,255,.5)"}" onclick="selCat('${c.id}')">${c.icon} ${c.label}</button>`).join("")}
    </div>
    ${_selType==="Investment"?`<div class="lbl">Investment Name (e.g. Zerodha SIP)</div><input class="inp" id="f_invname" value="${invName}" placeholder="e.g. Nifty 50 SIP"/>`:``}
    <div class="lbl">Date</div>
    <input class="inp" id="f_date" type="date" value="${dt}"/>
    <div class="lbl">Note (optional)</div>
    <input class="inp" id="f_note" value="${note}" placeholder="Any note..."/>
    <div class="btn-row">
      <button class="btn-cancel" onclick="setView('dashboard')">Cancel</button>
      <button class="btn-save" onclick="saveExpense('${e?.id||""}')">${e?"Update":"Save"}</button>
    </div>
  </div>`;
}

function expRow(e){
  const c=catOf(e.cat);const pc=PC[e.payer]||"#999";
  const tc=TYPE_COLORS[e.type]||"#999";
  return `<div class="exp-row">
    <div class="exp-icon" style="background:${c.color}18">${c.icon}</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.desc}</div>
      <div style="font-size:11px;color:rgba(255,255,255,.4)">${new Date(e.date).toLocaleDateString("en-IN",{day:"numeric",month:"short"})} · ${c.label}</div>
      ${e.invName?`<div style="font-size:11px;color:#34d399">📊 ${e.invName}</div>`:""}
      ${e.note?`<div style="font-size:11px;color:rgba(255,255,255,.3);font-style:italic">${e.note}</div>`:""}
      <span class="exp-payer" style="background:${pc}18;color:${pc}">${e.payer}</span>
      <span class="exp-type-badge" style="background:${tc}18;color:${tc}">${TYPE_ICONS[e.type]} ${e.type}</span>
    </div>
    <div style="text-align:right;flex-shrink:0">
      <div style="font-weight:800;font-size:15px">${fmt(e.amount)}</div>
      <div style="display:flex;gap:5px;margin-top:5px;justify-content:flex-end">
        <button class="action-btn" onclick="editExp('${e.id}')">✏️</button>
        <button class="action-btn del-btn" onclick="delExp('${e.id}')">🗑️</button>
      </div>
    </div>
  </div>`;
}

// ── ACTIONS ────────────────────────────────────────────
const filtered=()=>state.expenses.filter(e=>{const d=new Date(e.date);return d.getMonth()===state.filterMonth&&d.getFullYear()===state.filterYear;});
function setMonth(m){state.filterMonth=m;render();}
function setView(v){state.view=v;if(v==="add"&&!state.editId){_selCat="grocery";_selPayer="Yagyansh";_selType="Shared";}if(v!=="add")state.editId=null;render();}
function setHS(v){state.histSearch=v;render();}
function setHC(v){state.histCat=v;render();}
function setHP(v){state.histPayer=v;render();}
function setHT(v){state.histType=v;render();}
function setPersonalPerson(p){state.personalPerson=p;render();}

function selType(t){
  _selType=t;
  const cats=catsFor(t);_selCat=cats[0].id;
  // update type buttons
  EXP_TYPES.forEach(x=>{const b=document.getElementById("tb_"+x);if(!b)return;b.style.borderColor=x===t?TYPE_COLORS[x]:"rgba(255,255,255,.08)";b.style.background=x===t?TYPE_COLORS[x]+"22":"rgba(255,255,255,.04)";b.style.color=x===t?TYPE_COLORS[x]:"rgba(255,255,255,.4)";});
  // rebuild cat grid
  const cg=document.getElementById("cat-grid");
  if(cg)cg.innerHTML=cats.map(c=>`<button class="cat-btn" id="cb_${c.id}" style="border-color:${_selCat===c.id?c.color:"rgba(255,255,255,.08)"};background:${_selCat===c.id?c.color+"22":"rgba(255,255,255,.04)"};color:${_selCat===c.id?c.color:"rgba(255,255,255,.5)"}" onclick="selCat('${c.id}')">${c.icon} ${c.label}</button>`).join("");
  // show/hide investment name field
  const existing=document.getElementById("f_invname");
  if(t==="Investment"&&!existing){
    const noteEl=document.querySelector(".btn-row");
    if(noteEl){const div=document.createElement("div");div.innerHTML=`<div class="lbl" style="margin-top:0">Investment Name</div><input class="inp" id="f_invname" placeholder="e.g. Nifty 50 SIP"/>`;noteEl.parentNode.insertBefore(div,noteEl.previousElementSibling);}
  } else if(t!=="Investment"&&existing){existing.parentNode.remove();}
}
function selCat(id){_selCat=id;ALL_CATS.forEach(c=>{const b=document.getElementById("cb_"+c.id);if(!b)return;b.style.borderColor=c.id===id?c.color:"rgba(255,255,255,.08)";b.style.background=c.id===id?c.color+"22":"rgba(255,255,255,.04)";b.style.color=c.id===id?c.color:"rgba(255,255,255,.5)";});}
function selPayer(p){_selPayer=p;PAYERS.forEach(x=>{const b=document.getElementById("pb_"+x);if(!b)return;b.style.borderColor=x===p?PC[x]:"rgba(255,255,255,.08)";b.style.background=x===p?PC[x]+"22":"rgba(255,255,255,.04)";b.style.color=x===p?PC[x]:"rgba(255,255,255,.5)";});}

async function saveExpense(editId){
  const desc=document.getElementById("f_desc")?.value?.trim();
  const amt=parseFloat(document.getElementById("f_amt")?.value);
  const date=document.getElementById("f_date")?.value;
  const note=document.getElementById("f_note")?.value?.trim()||"";
  const invName=document.getElementById("f_invname")?.value?.trim()||"";
  if(!desc){showToast("⚠️ Enter a description.");return;}
  if(!amt||amt<=0){showToast("⚠️ Enter a valid amount.");return;}
  const exp={id:editId||genId(),desc,amount:amt,cat:_selCat,date,note,payer:_selPayer,type:_selType,invName};
  if(editId)await updateExpense(exp);else await addExpense(exp);
}
function editExp(id){state.editId=id;state.view="add";render();}
async function delExp(id){if(!confirm("Delete this expense?"))return;await deleteExpense(id);}
async function syncNow(){await loadExpenses();showToast("🔄 Synced!");}

// ── INIT ───────────────────────────────────────────────
if(accessToken)loadExpenses();else render();
</script>
</body>
</html>
